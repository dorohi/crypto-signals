<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11161D"/>
      <stop offset="1" stop-color="#0A0D12"/>
    </linearGradient>
    <linearGradient id="area" x1="256" y1="150" x2="256" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16C784" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#16C784" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- area under the trend line -->
  <path d="M120 370 L210 300 L290 330 L392 152 L392 392 L120 392 Z" fill="url(#area)"/>

  <!-- rising trend line -->
  <g filter="url(#glow)">
    <path d="M120 370 L210 300 L290 330 L392 152"
          stroke="#16C784" stroke-width="26"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- arrow head pointing up-right -->
    <path d="M392 152 L338 158 M392 152 L386 206"
          stroke="#16C784" stroke-width="26"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- vertex dots -->
  <circle cx="120" cy="370" r="14" fill="#16C784"/>
  <circle cx="210" cy="300" r="14" fill="#16C784"/>
  <circle cx="290" cy="330" r="14" fill="#16C784"/>
</svg>
